<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>크리퍼는 어디에?</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root {
    --night: #14201a;
    --night-2: #1c2b22;
    --grass-top: #6fae3f;
    --grass-side: #4d7a2b;
    --dirt: #8a5a34;
    --dirt-dark: #6b4426;
    --stone: #8f8f88;
    --stone-dark: #5c5c57;
    --creeper: #0fa348;
    --creeper-dark: #0a6e30;
    --tnt: #c73a2b;
    --cream: #ece4cf;
    --cream-dim: #b9b09a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,0.08) 0%, transparent 2%),
      radial-gradient(circle at 70% 30%, rgba(255,255,255,0.06) 0%, transparent 1.5%),
      radial-gradient(circle at 85% 70%, rgba(255,255,255,0.05) 0%, transparent 1.5%),
      radial-gradient(circle at 40% 80%, rgba(255,255,255,0.06) 0%, transparent 1.5%),
      linear-gradient(180deg, var(--night) 0%, var(--night-2) 100%);
    font-family: 'VT323', monospace;
    color: var(--cream);
    padding: 24px;
  }

  .panel {
    width: 100%;
    max-width: 480px;
    background: #24352a;
    border: 6px solid #10190f;
    box-shadow:
      inset 0 0 0 4px #3a5230,
      0 12px 0 rgba(0,0,0,0.35);
    padding: 28px 24px 24px;
    position: relative;
  }

  .grass-strip {
    height: 14px;
    margin: -28px -24px 20px;
    background:
      repeating-linear-gradient(90deg, var(--grass-top) 0 14px, var(--grass-side) 14px 28px);
    border-bottom: 4px solid var(--dirt-dark);
  }

  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: 15px;
    line-height: 1.9;
    color: var(--cream);
    text-align: center;
    margin: 0 0 6px;
    text-shadow: 3px 3px 0 #0a0f0a;
  }

  .sub {
    text-align: center;
    font-size: 19px;
    color: var(--cream-dim);
    margin: 0 0 22px;
  }

  .explosion-counter {
    text-align: center;
    font-size: 17px;
    color: #ff9a7a;
    margin: -14px 0 20px;
  }

  .stage {
    position: relative;
    min-height: 96px;
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: min-height 0.3s ease;
  }
  .stage.exploding {
    min-height: 180px;
  }
  .stage.exploding .creeper-face { display: none; }

  /* pixel creeper face, rendered from an 8x8 matrix */
  .creeper-face {
    display: grid;
    grid-template-columns: repeat(8, 12px);
    grid-template-rows: repeat(8, 12px);
    box-shadow: 0 6px 0 rgba(0,0,0,0.4);
    transition: transform 0.25s ease;
  }
  .px-L { background: #52d94a; }
  .px-M { background: #2f9c2a; }
  .px-D { background: #1a5e18; }
  .px-Y { background: #b3b3b3; }
  .px-K { background: #0d0f0a; }
  .creeper-face.shake { animation: shake 0.4s ease; }

  /* creeper explosion burst, shown when the player loses */
  .explosion-burst {
    display: none;
    position: relative;
    width: 100%;
    height: 160px;
    overflow: visible;
  }
  .stage.exploding .explosion-burst { display: block; }

  .blast-flash {
    position: absolute;
    left: 50%; top: 50%;
    width: 90px; height: 90px;
    background: radial-gradient(circle, #ffffff 0%, #e4e4e4 45%, transparent 75%);
    transform: translate(-50%, -50%) scale(0.2);
    opacity: 0;
    animation: flashPop 0.35s ease-out forwards;
  }
  @keyframes flashPop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
    30%  { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.9); }
  }

  /* big blocky gray smoke chunks that billow outward into a cloud */
  .smoke-puff {
    position: absolute;
    left: 50%; top: 50%;
    width: var(--size); height: var(--size);
    background: var(--tone);
    transform: translate(-50%, -50%) scale(0.4);
    opacity: 0;
    animation: puffDrift 1.15s ease-out forwards;
    animation-delay: var(--delay);
  }
  @keyframes puffDrift {
    0%   { opacity: 0;    transform: translate(-50%, -50%) translate(0, 0) scale(0.4) rotate(0deg); }
    18%  { opacity: 0.95; }
    100% { opacity: 0;    transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) scale(1.7) rotate(var(--rot)); }
  }

  .chunk {
    position: absolute;
    left: 50%; top: 50%;
    width: var(--size); height: var(--size);
    background: var(--tone);
    transform: translate(-50%, -50%);
    opacity: 1;
    animation: chunkFly 0.85s cubic-bezier(.2,.7,.3,1) forwards;
    animation-delay: var(--delay);
  }
  @keyframes chunkFly {
    0%   { transform: translate(-50%, -50%) translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
    65%  { opacity: 1; }
    100% { transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(0.35); opacity: 0; }
  }

  .panel.shake-panel { animation: panelShake 0.5s ease; }
  @keyframes panelShake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-6px, 2px); }
    40% { transform: translate(6px, -2px); }
    60% { transform: translate(-4px, 3px); }
    80% { transform: translate(4px, -3px); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0) rotate(0); }
    25% { transform: translateX(-4px) rotate(-3deg); }
    75% { transform: translateX(4px) rotate(3deg); }
  }

  .choices {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }

  .block-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: var(--cream);
    background: var(--dirt);
    border: none;
    box-shadow:
      inset -5px -5px 0 var(--dirt-dark),
      inset 5px 5px 0 rgba(255,255,255,0.15);
    padding: 18px 4px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  .block-btn:hover:not(:disabled) {
    filter: brightness(1.12);
  }
  .block-btn:active:not(:disabled) {
    transform: translateY(2px);
  }
  .block-btn:disabled {
    cursor: default;
    opacity: 0.55;
  }
  .block-btn.picked {
    background: var(--stone);
    box-shadow:
      inset -5px -5px 0 var(--stone-dark),
      inset 5px 5px 0 rgba(255,255,255,0.15);
  }

  .message-box {
    min-height: 78px;
    background: #10170f;
    border: 3px solid #050804;
    padding: 14px 16px;
    font-size: 21px;
    line-height: 1.5;
    color: var(--cream);
    white-space: pre-wrap;
  }
  .message-box .safe { color: #8fe27a; }
  .message-box .danger { color: #ff8f7a; }

  .countdown {
    font-family: 'Press Start 2P', monospace;
    font-size: 34px;
    color: var(--tnt);
    text-align: center;
    margin-top: 10px;
    text-shadow: 3px 3px 0 #2a0a05;
    min-height: 44px;
  }

  .retry-btn {
    display: block;
    margin: 18px auto 0;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: var(--cream);
    background: var(--grass-side);
    border: none;
    box-shadow:
      inset -4px -4px 0 #2f4a1c,
      inset 4px 4px 0 rgba(255,255,255,0.18);
    padding: 12px 18px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  .retry-btn:active { transform: translateY(2px); }
  .retry-btn.hidden { display: none; }

  @media (max-width: 380px) {
    h1 { font-size: 12px; }
    .block-btn { font-size: 10px; padding: 14px 2px; }
  }

  /* tab navigation */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
  }
  .tab-btn {
    flex: 1;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: var(--cream-dim);
    background: #182118;
    border: none;
    box-shadow: inset 0 -3px 0 #0a0f0a;
    padding: 10px 4px;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  .tab-btn.active {
    color: var(--cream);
    background: var(--dirt);
    box-shadow: inset -4px -4px 0 var(--dirt-dark), inset 4px 4px 0 rgba(255,255,255,0.15);
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* zombie-villager item grid */
  .item-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .item-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    font-family: 'VT323', monospace;
    font-size: 16px;
    color: var(--cream);
    background: var(--dirt);
    border: none;
    box-shadow: inset -4px -4px 0 var(--dirt-dark), inset 4px 4px 0 rgba(255,255,255,0.15);
    padding: 10px 4px 12px;
    cursor: pointer;
  }
  .item-btn:hover:not(:disabled) { filter: brightness(1.12); }
  .item-btn:active:not(:disabled) { transform: translateY(2px); }
  .item-btn:disabled { cursor: default; opacity: 0.55; }
  .item-btn.picked {
    background: var(--stone);
    box-shadow: inset -4px -4px 0 var(--stone-dark), inset 4px 4px 0 rgba(255,255,255,0.15);
  }

  .item-icon { position: relative; width: 40px; height: 40px; }

  .pixel-icon {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: 40px; height: 40px;
  }

  .message-box { text-align: center; }
  .message-box .neutral, .outcome-label.neutral { color: var(--cream-dim); }
  .message-box .peace, .outcome-label.peace { color: #ff9ad1; }
  .outcome-label.safe { color: #8fe27a; }
  .outcome-label.danger { color: #ff8f7a; }

  .outcome-label {
    text-align: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 15px;
    letter-spacing: 1px;
    margin: 12px 0 0;
    min-height: 15px;
  }

  /* zombie / villager face pair */
  .pixel-face {
    display: grid;
    grid-template-columns: repeat(8, 12px);
    grid-template-rows: repeat(8, 12px);
    box-shadow: 0 6px 0 rgba(0,0,0,0.4);
  }
  .face-pair { display: flex; justify-content: center; gap: 26px; margin-bottom: 22px; }
  .face-slot { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .face-label { font-family: 'VT323', monospace; font-size: 17px; color: var(--cream-dim); }

  /* fullscreen death screen */
  .death-screen {
    display: none;
    position: fixed; inset: 0;
    z-index: 1000;
    background: radial-gradient(ellipse at center, #4a0d0d 0%, #200707 65%, #0a0202 100%);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    opacity: 0;
    animation: deathFade 0.6s ease forwards;
  }
  .death-screen.show { display: flex; }
  @keyframes deathFade { to { opacity: 1; } }
  .death-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 30px;
    color: #ff4d4d;
    text-shadow: 4px 4px 0 #3a0000;
    margin-bottom: 18px;
    text-align: center;
  }
  .death-sub {
    font-family: 'VT323', monospace;
    font-size: 22px;
    color: #e8c9c9;
    margin-bottom: 32px;
    text-align: center;
  }
  .death-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: #e8c9c9;
    background: #3a2020;
    border: 2px solid #1a0f0f;
    padding: 12px 24px;
    cursor: pointer;
  }
  .death-btn:hover { background: #4a2828; }
  .death-btn:active { transform: translateY(2px); }

  /* battle lobby */
  .battle-lobby { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .room-input {
    width: 100%;
    font-family: 'VT323', monospace;
    font-size: 22px;
    text-align: center;
    letter-spacing: 4px;
    text-transform: uppercase;
    background: #10170f;
    border: 3px solid #050804;
    color: var(--cream);
    padding: 10px;
  }
  .room-input::placeholder { color: var(--cream-dim); letter-spacing: 1px; text-transform: none; }
  .lobby-btns { display: flex; gap: 10px; width: 100%; }
  .lobby-btns .block-btn { flex: 1; padding: 14px 4px; }
  .lobby-status { font-family: 'VT323', monospace; font-size: 18px; color: var(--cream-dim); min-height: 22px; text-align: center; }

  .hidden { display: none !important; }

  /* battle room */
  .room-bar {
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'VT323', monospace; font-size: 19px; color: var(--cream-dim);
    margin-bottom: 16px;
  }
  .room-bar b { color: var(--cream); letter-spacing: 2px; }
  .leave-btn {
    font-family: 'Press Start 2P', monospace; font-size: 9px; color: var(--cream-dim);
    background: #10170f; border: none; padding: 8px 10px; cursor: pointer;
  }
  .leave-btn:hover { color: var(--cream); }

  .battle-status {
    text-align: center; font-family: 'VT323', monospace; font-size: 19px;
    color: var(--cream-dim); margin-bottom: 16px; min-height: 24px;
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 10px;
  }
  .mob-card {
    aspect-ratio: 3/4;
    background: #182118;
    box-shadow: inset 0 -3px 0 #0a0f0a;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Press Start 2P', monospace;
    color: var(--cream-dim);
    font-size: 16px;
  }
  .mob-card:hover:not(:disabled) { filter: brightness(1.2); }
  .mob-card:disabled { cursor: default; }
  .mob-card.picked-back { opacity: 0.35; }

  .battle-result { margin-top: 4px; }
  .vs-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 14px; }
  .vs-card {
    flex: 1;
    max-width: 150px;
    aspect-ratio: 3/4;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    font-family: 'VT323', monospace;
    box-shadow: 0 6px 0 rgba(0,0,0,0.4);
    padding: 8px;
  }
  .vs-card .mob-name { font-size: 20px; }
  .vs-card .mob-power { font-family: 'Press Start 2P', monospace; font-size: 15px; }
  .vs-label { font-family: 'Press Start 2P', monospace; font-size: 13px; color: var(--tnt); }

  .mob-icon {
    display: grid;
    width: 64px;
    margin: 0 auto 8px;
  }

  /* snow-blind penalty overlay */
  .snow-overlay {
    display: none;
    position: fixed; inset: 0;
    z-index: 900;
    background: #eef3f8;
    align-items: center; justify-content: center;
    animation: snowFlash 0.3s ease;
  }
  .snow-overlay.show { display: flex; }
  @keyframes snowFlash { from { opacity: 0; } to { opacity: 1; } }
  .snow-text {
    font-family: 'Press Start 2P', monospace;
    font-size: 16px;
    color: #2b3a4a;
    text-align: center;
    padding: 0 20px;
  }

  /* ink-blind penalty overlay (squid) */
  .ink-overlay {
    display: none;
    position: fixed; inset: 0;
    z-index: 900;
    background: #0a0a16;
    align-items: center; justify-content: center;
    animation: snowFlash 0.3s ease;
  }
  .ink-overlay.show { display: flex; }
  .ink-text {
    font-family: 'Press Start 2P', monospace;
    font-size: 16px;
    color: #b8b8e0;
    text-align: center;
    padding: 0 20px;
  }

  /* secret-swap window after playing a disruption card */
  .swap-window {
    text-align: center;
    font-family: 'VT323', monospace;
    font-size: 18px;
    color: var(--cream);
    margin-top: 6px;
  }
  .swap-window .countdown { margin: 6px 0; }

  .death-screen.poison {
    background: radial-gradient(ellipse at center, #123a12 0%, #0a1f0a 65%, #020a02 100%);
  }
  .death-screen.poison .death-title { color: #7aff4d; text-shadow: 4px 4px 0 #0a2a0a; }
</style>
</head>
<body>

<div class="panel">
  <div class="grass-strip"></div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="creeper">크리퍼 게임</button>
    <button class="tab-btn" data-tab="zombie">주민 구하기</button>
    <button class="tab-btn" data-tab="battle">몹 카드 대결</button>
  </div>

  <div class="tab-panel active" id="tab-creeper">
  <h1>크리퍼는 어디에?</h1>
  <p class="sub">세 블록 중 하나에 크리퍼가 숨어있어요</p>
  <p class="explosion-counter">오늘 폭발한 크리퍼 수: <span id="explosionCount">-</span></p>

  <div class="stage" id="stage">
    <div class="creeper-face" id="creeperFace"></div>
    <div class="explosion-burst" id="explosionBurst"></div>
  </div>

  <div class="choices" id="choices">
    <button class="block-btn" data-choice="1번">1번</button>
    <button class="block-btn" data-choice="2번">2번</button>
    <button class="block-btn" data-choice="3번">3번</button>
  </div>

  <div class="message-box" id="messageBox">블록을 하나 골라서 크리퍼를 찾아보세요.</div>
  <div class="countdown" id="countdown"></div>

  <button class="retry-btn hidden" id="retryBtn">다시 도전하기</button>
  </div>

  <div class="tab-panel" id="tab-zombie">
  <h1>주민을 구하라!</h1>
  <p class="sub">좀비로부터 주민을 구할 무기를 골라주세요</p>

  <div class="face-pair">
    <div class="face-slot">
      <div class="pixel-face" id="zombieFace"></div>
      <span class="face-label">좀비</span>
    </div>
    <div class="face-slot">
      <div class="pixel-face" id="villagerFace"></div>
      <span class="face-label">주민</span>
    </div>
  </div>

  <div class="item-grid" id="itemGrid">
    <button class="item-btn" data-item="다이아몬드 검">
      <span class="pixel-icon" id="iconSword"></span>
      다이아몬드 검
    </button>
    <button class="item-btn" data-item="닭고기">
      <span class="pixel-icon" id="iconChicken"></span>
      닭고기
    </button>
    <button class="item-btn" data-item="잔디 블록">
      <span class="pixel-icon" id="iconGrass"></span>
      잔디 블록
    </button>
    <button class="item-btn" data-item="민들레">
      <span class="pixel-icon" id="iconFlower"></span>
      민들레
    </button>
    <button class="item-btn" data-item="나무 곡괭이">
      <span class="pixel-icon" id="iconPickaxe"></span>
      나무 곡괭이
    </button>
    <button class="item-btn" data-item="tnt">
      <span class="pixel-icon" id="iconTnt"></span>
      TNT
    </button>
  </div>

  <div class="message-box" id="zombieMessage">주민을 구할 아이템을 골라보세요.</div>
  <div class="outcome-label" id="zombieLabel"></div>
  <div class="countdown" id="zombieCountdown"></div>

  <button class="retry-btn hidden" id="zombieRetryBtn">다시 선택하기</button>
  </div>

  <div class="tab-panel" id="tab-battle">
  <h1>몹 카드 대결</h1>
  <p class="sub">상대와 동시에 카드를 뽑아 공격력을 겨루세요</p>

  <div class="battle-lobby" id="battleLobby">
    <input type="text" class="room-input" id="roomInput" placeholder="방 코드 입력" maxlength="6">
    <div class="lobby-btns">
      <button class="block-btn" id="joinRoomBtn">입장하기</button>
      <button class="block-btn" id="newRoomBtn">새 방 만들기</button>
    </div>
    <div class="lobby-status" id="lobbyStatus"></div>
  </div>

  <div class="battle-room hidden" id="battleRoom">
    <div class="room-bar">
      <span>방 코드: <b id="roomCodeLabel"></b></span>
      <button class="leave-btn" id="leaveRoomBtn">나가기</button>
    </div>

    <div class="battle-status" id="battleStatus">상대를 기다리는 중...</div>

    <div class="card-grid" id="cardGrid"></div>

    <div class="swap-window hidden" id="swapWindow">
      <div id="swapMobLabel"></div>
      <div class="countdown" id="swapCountdown"></div>
      <button class="retry-btn" id="swapBtn">다른 카드로 몰래 교체하기</button>
    </div>

    <div class="battle-result hidden" id="battleResult">

  function buildExplosion() {
    explosionBurst.innerHTML = '';
    const flash = document.createElement('div');
    flash.className = 'blast-flash';
    explosionBurst.appendChild(flash);

    // big billowing gray smoke chunks (the bulk of the cloud)
    const puffCount = 16;
    for (let i = 0; i < puffCount; i++) {
      const angle = (Math.PI * 2 * i) / puffCount + (Math.random() * 0.5 - 0.25);
      const dist = 20 + Math.random() * 48;
      const tx = Math.cos(angle) * dist;
      const ty = Math.sin(angle) * dist * 0.75 - 18;
      const size = 22 + Math.random() * 26;
      const tone = SMOKE_TONES[Math.floor(Math.random() * SMOKE_TONES.length)];
      const delay = Math.random() * 0.12;
      const rot = (Math.random() * 360 - 180) + 'deg';

      const puff = document.createElement('span');
      puff.className = 'smoke-puff';
      puff.style.setProperty('--tx', tx.toFixed(1) + 'px');
      puff.style.setProperty('--ty', ty.toFixed(1) + 'px');
      puff.style.setProperty('--rot', rot);
      puff.style.setProperty('--size', size.toFixed(1) + 'px');
      puff.style.setProperty('--tone', tone);
      puff.style.setProperty('--delay', delay.toFixed(2) + 's');
      explosionBurst.appendChild(puff);
    }

    // smaller fast-flying chips on top for texture
    const count = 22;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() * 0.4 - 0.2);
      const dist = 55 + Math.random() * 60;
      const tx = Math.cos(angle) * dist;
      const ty = Math.sin(angle) * dist * 0.8 - 15;

      chunk.style.setProperty('--tx', tx.toFixed(1) + 'px');
      chunk.style.setProperty('--ty', ty.toFixed(1) + 'px');
      chunk.style.setProperty('--rot', rot);
      chunk.style.setProperty('--size', size.toFixed(1) + 'px');
      chunk.style.setProperty('--tone', tone);
      chunk.style.setProperty('--delay', delay.toFixed(2) + 's');
      explosionBurst.appendChild(chunk);
    }
  }

  function getOrCreateClientId(roomCode) {
    const key = 'battle_client_' + roomCode;
    let id = sessionStorage.getItem(key);
    if (!id) {
      id = 'p' + Math.random().toString(36).slice(2, 10);
      sessionStorage.setItem(key, id);
    }
    return id;
  }

  function randomRoomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    for (let i = 0; i < 5; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }

  async function joinRoom(code) {
    if (!db) { lobbyStatus.textContent = 'Firebase 설정이 필요합니다.'; return; }
    code = code.trim().toUpperCase();
    if (!code) { lobbyStatus.textContent = '방 코드를 입력해주세요.'; return; }
    lobbyStatus.textContent = '입장하는 중...';

    const myId = getOrCreateClientId(code);
    const roomRef = db.ref('battles/' + code);
    let slot = null;
    try {
      let res = await roomRef.child('player1Id').transaction(cur => (cur === null || cur === myId) ? myId : cur);
      if (res.committed && res.snapshot.val() === myId) slot = 'player1';
      if (!slot) {
        res = await roomRef.child('player2Id').transaction(cur => (cur === null || cur === myId) ? myId : cur);
        if (res.committed && res.snapshot.val() === myId) slot = 'player2';
      }
    } catch (e) {
      lobbyStatus.textContent = '입장에 실패했습니다. 잠시 후 다시 시도해주세요.';
      return;
    }
    if (!slot) {
      lobbyStatus.textContent = '방이 가득 찼습니다. 다른 코드를 사용해주세요.';
      return;
    }

    roomId = code;
    mySlot = slot;
    lastProcessedRound = -1;
    cardsRenderedForRound = false;
    disruptHandledRound = -1;
    lobbyStatus.textContent = '';
    battleLobby.classList.add('hidden');
    battleRoom.classList.remove('hidden');
    roomCodeLabel.textContent = roomId;

    battleRoomRef = roomRef;
    battleListener = (snap) => { syncBattleUI(snap.val() || {}); };
    roomRef.on('value', battleListener);
  }

  function leaveRoom() {
    if (swapTimer) { clearInterval(swapTimer); swapTimer = null; }
    swapWindow.classList.add('hidden');
    if (battleRoomRef && battleListener) battleRoomRef.off('value', battleListener);
    if (db && roomId && mySlot) {
      db.ref('battles/' + roomId + '/' + mySlot + 'Id').set(null);
      db.ref('battles/' + roomId + '/' + mySlot + 'Pick').set(null);
      db.ref('battles/' + roomId + '/' + mySlot + 'Locked').set(null);
    }
    roomId = null; mySlot = null; battleRoomRef = null; battleListener = null;
    battleRoom.classList.add('hidden');
    battleLobby.classList.remove('hidden');
    roomInput.value = '';
    lobbyStatus.textContent = '';
  }

  function renderMyCards() {
    cardGrid.innerHTML = '';
    const shuffled = [...MOBS].sort(() => Math.random() - 0.5);
    shuffled.forEach(mob => {
      const btn = document.createElement('button');
      btn.className = 'mob-card';
      btn.textContent = '?';
      btn.addEventListener('click', () => pickCard(mob));
      cardGrid.appendChild(btn);
    });
  }

  function pickCard(mob) {
    [...cardGrid.children].forEach(b => { b.disabled = true; b.classList.add('picked-back'); });
    commitPick(mob, true);
  }

  function commitPick(mob, allowSwap) {
    if (!db || !roomId) return;
    const disruptive = isDisruptive(mob.name);
    db.ref('battles/' + roomId).update({
      [mySlot + 'Pick']: { name: mob.name, power: mob.power },
      [mySlot + 'Locked']: !(disruptive && allowSwap),
    });
    if (disruptive && allowSwap) startSwapWindow(mob);
  }

  function startSwapWindow(currentMob) {
    swapWindow.classList.remove('hidden');
    swapMobLabel.textContent = currentMob.name + ' 카드를 뽑았어요! 몰래 바꿀까요?';
    let remaining = 5;
    swapCountdown.textContent = remaining;
    swapBtn.disabled = false;

    swapBtn.onclick = () => {
      if (swapTimer) { clearInterval(swapTimer); swapTimer = null; }
      const pool = MOBS.filter(m => m.name !== currentMob.name);
      const newMob = pool[Math.floor(Math.random() * pool.length)];
      finalizeSwapWindow(newMob);
    };

    swapTimer = setInterval(() => {
      remaining -= 1;
      if (remaining <= 0) {
        clearInterval(swapTimer);
        swapTimer = null;
        finalizeSwapWindow(currentMob);
      } else {
        swapCountdown.textContent = remaining;
      }
    }, 1000);
  }

  function finalizeSwapWindow(finalMob) {
    swapWindow.classList.add('hidden');
    swapBtn.onclick = null;
    if (!db || !roomId) return;
    db.ref('battles/' + roomId).update({
      [mySlot + 'Pick']: { name: finalMob.name, power: finalMob.power },

  function mobIconHTML(name) {
    const matrix = MOB_PIXEL_DATA[name];
    if (!matrix) return '';
    const rows = matrix.length, cols = matrix[0].length;
    let cells = '';
    matrix.forEach(row => {
      row.forEach(c => { cells += `<div style="background:${c || 'transparent'}"></div>`; });
    });
    return `<div class="mob-icon" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr);aspect-ratio:${cols}/${rows};">${cells}</div>`;
  }

  }

  function triggerDisruptionEffect(name) {
    if (name === '눈사람') showSnowBlind();
    else if (name === '오징어') showInkBlind();
  }

  function resolveRound(myPick, oppPick) {
    myCardBox.innerHTML = mobCardHTML(myPick);
    oppCardBox.innerHTML = mobCardHTML(oppPick);
    myCardBox.style.background = MOB_COLORS[myPick.name] || '#8a5a34';
    oppCardBox.style.background = MOB_COLORS[oppPick.name] || '#8a5a34';
    myCardBox.style.color = MOB_LIGHT_TEXT.includes(myPick.name) ? '#2a2a2a' : '#f2ece0';
    oppCardBox.style.color = MOB_LIGHT_TEXT.includes(oppPick.name) ? '#2a2a2a' : '#f2ece0';

    const won = myPick.power > oppPick.power;
    battleOutcomeLabel.textContent = won ? '승리!' : '패배...';
    battleOutcomeLabel.className = 'outcome-label ' + (won ? 'safe' : 'danger');

    if (!won) {
      const isPoison = oppPick.name === '복어';
      deathTitleEl.textContent = 'You Died!';
      deathSubEl.textContent = isPoison
        ? '복어의 독에 중독되어 목숨을 잃었습니다'
        : (oppPick.name + '에게 패배하여 목숨을 잃었습니다');
      deathScreen.classList.toggle('poison', isPoison);
      deathScreen.classList.add('show');
    }
  }

  function syncBattleUI(data) {
    if (!mySlot) return;
    const oppSlot = mySlot === 'player1' ? 'player2' : 'player1';
    const oppPresent = !!data[oppSlot + 'Id'];
    const myPick = data[mySlot + 'Pick'];
    const oppPick = data[oppSlot + 'Pick'];
    const myLocked = !!data[mySlot + 'Locked'];
    const oppLocked = !!data[oppSlot + 'Locked'];
    const round = data.round || 0;

    if (!myPick && !oppPick) {
      battleResult.classList.add('hidden');
      cardGrid.classList.remove('hidden');
      if (!cardsRenderedForRound) {
        renderMyCards();
        cardsRenderedForRound = true;
      }
    }

    // trigger my own screen blackout the moment the opponent plays a disruption card
    // (even before they've locked in / possibly swapped it)
    if (oppPick && isDisruptive(oppPick.name) && disruptHandledRound !== round) {
      disruptHandledRound = round;
      triggerDisruptionEffect(oppPick.name);
    }

    if (!oppPresent) {
      battleStatus.textContent = '상대를 기다리는 중... (방 코드를 공유하세요)';
    } else if (!myPick) {
      battleStatus.textContent = '카드를 한 장 골라주세요';
    } else if (!oppPick || !oppLocked) {
      battleStatus.textContent = '상대의 선택을 기다리는 중...';
    } else {
      battleStatus.textContent = '';
    }

    if (myPick && oppPick && myLocked && oppLocked) {
      cardGrid.classList.add('hidden');
      battleResult.classList.remove('hidden');
      if (round !== lastProcessedRound) {
        lastProcessedRound = round;
        cardsRenderedForRound = false;
        resolveRound(myPick, oppPick);
      }
    }
  }

  function battleNextRound() {
    if (!db || !roomId) return;
    if (swapTimer) { clearInterval(swapTimer); swapTimer = null; }
    swapWindow.classList.add('hidden');
    disruptHandledRound = -1;
    deathScreen.classList.remove('show');
    deathScreen.classList.remove('poison');
    db.ref('battles/' + roomId).update({
      round: firebase.database.ServerValue.increment(1),
      player1Pick: null,
      player2Pick: null,
      player1Locked: null,
      player2Locked: null,
    });
  }

  function handleDeathRespawn() {
    deathScreen.classList.remove('show');
    deathScreen.classList.remove('poison');
    if (document.getElementById('tab-battle').classList.contains('active')) {
      battleNextRound();
    } else {
      resetZombie();
    }
  }

  joinRoomBtn.addEventListener('click', () => joinRoom(roomInput.value));
  newRoomBtn.addEventListener('click', () => {
    const code = randomRoomCode();
    roomInput.value = code;
    joinRoom(code);
  });
  roomInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinRoom(roomInput.value); });
  leaveRoomBtn.addEventListener('click', leaveRoom);
  nextRoundBtn.addEventListener('click', battleNextRound);
</script>

</body>
</html>
