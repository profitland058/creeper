<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>크리퍼는 어디에?</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root {
    --night: #14201a;
    --night-2: #1c2b22;
    --grass-top: #6fae3f;
    --grass-side: #4d7a2b;
    --dirt: #8a5a34;
    --dirt-dark: #6b4426;
    --stone: #8f8f88;
    --stone-dark: #5c5c57;
    --creeper: #0fa348;
    --creeper-dark: #0a6e30;
    --tnt: #c73a2b;
    --cream: #ece4cf;
    --cream-dim: #b9b09a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,0.08) 0%, transparent 2%),
      radial-gradient(circle at 70% 30%, rgba(255,255,255,0.06) 0%, transparent 1.5%),
      radial-gradient(circle at 85% 70%, rgba(255,255,255,0.05) 0%, transparent 1.5%),
      radial-gradient(circle at 40% 80%, rgba(255,255,255,0.06) 0%, transparent 1.5%),
      linear-gradient(180deg, var(--night) 0%, var(--night-2) 100%);
    font-family: 'VT323', monospace;
    color: var(--cream);
    padding: 24px;
  }

  .panel {
    width: 100%;
    max-width: 480px;
    background: #24352a;
    border: 6px solid #10190f;
    box-shadow:
      inset 0 0 0 4px #3a5230,
      0 12px 0 rgba(0,0,0,0.35);
    padding: 28px 24px 24px;
    position: relative;
  }

  .grass-strip {
    height: 14px;
    margin: -28px -24px 20px;
    background:
      repeating-linear-gradient(90deg, var(--grass-top) 0 14px, var(--grass-side) 14px 28px);
    border-bottom: 4px solid var(--dirt-dark);
  }

  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: 15px;
    line-height: 1.9;
    color: var(--cream);
    text-align: center;
    margin: 0 0 6px;
    text-shadow: 3px 3px 0 #0a0f0a;
  }

  .sub {
    text-align: center;
    font-size: 19px;
    color: var(--cream-dim);
    margin: 0 0 22px;
  }

  .explosion-counter {
    text-align: center;
    font-size: 17px;
    color: #ff9a7a;
    margin: -14px 0 20px;
  }

  .stage {
    position: relative;
    min-height: 96px;
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: min-height 0.3s ease;
  }
  .stage.exploding {
    min-height: 180px;
  }
  .stage.exploding .creeper-face { display: none; }

  /* pixel creeper face, rendered from an 8x8 matrix */
  .creeper-face {
    display: grid;
    grid-template-columns: repeat(8, 12px);
    grid-template-rows: repeat(8, 12px);
    box-shadow: 0 6px 0 rgba(0,0,0,0.4);
    transition: transform 0.25s ease;
  }
  .px-L { background: #52d94a; }
  .px-M { background: #2f9c2a; }
  .px-D { background: #1a5e18; }
  .px-Y { background: #b3b3b3; }
  .px-K { background: #0d0f0a; }
  .creeper-face.shake { animation: shake 0.4s ease; }

  /* creeper explosion burst, shown when the player loses */
  .explosion-burst {
    display: none;
    position: relative;
    width: 100%;
    height: 160px;
    overflow: visible;
  }
  .stage.exploding .explosion-burst { display: block; }

  .blast-flash {
    position: absolute;
    left: 50%; top: 50%;
    width: 90px; height: 90px;
    background: radial-gradient(circle, #ffffff 0%, #e4e4e4 45%, transparent 75%);
    transform: translate(-50%, -50%) scale(0.2);
    opacity: 0;
    animation: flashPop 0.35s ease-out forwards;
  }
  @keyframes flashPop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
    30%  { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.9); }
  }

  /* big blocky gray smoke chunks that billow outward into a cloud */
  .smoke-puff {
    position: absolute;
    left: 50%; top: 50%;
    width: var(--size); height: var(--size);
    background: var(--tone);
    transform: translate(-50%, -50%) scale(0.4);
    opacity: 0;
    animation: puffDrift 1.15s ease-out forwards;
    animation-delay: var(--delay);
  }
  @keyframes puffDrift {
    0%   { opacity: 0;    transform: translate(-50%, -50%) translate(0, 0) scale(0.4) rotate(0deg); }
    18%  { opacity: 0.95; }
    100% { opacity: 0;    transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) scale(1.7) rotate(var(--rot)); }
  }

  .chunk {
    position: absolute;
    left: 50%; top: 50%;
    width: var(--size); height: var(--size);
    background: var(--tone);
    transform: translate(-50%, -50%);
    opacity: 1;
    animation: chunkFly 0.85s cubic-bezier(.2,.7,.3,1) forwards;
    animation-delay: var(--delay);
  }
  @keyframes chunkFly {
    0%   { transform: translate(-50%, -50%) translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
    65%  { opacity: 1; }
    100% { transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(0.35); opacity: 0; }
  }

  .panel.shake-panel { animation: panelShake 0.5s ease; }
  @keyframes panelShake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-6px, 2px); }
    40% { transform: translate(6px, -2px); }
    60% { transform: translate(-4px, 3px); }
    80% { transform: translate(4px, -3px); }
  }
  @keyframes shake {
    0%,100% { transform: translateX(0) rotate(0); }
    25% { transform: translateX(-4px) rotate(-3deg); }
    75% { transform: translateX(4px) rotate(3deg); }
  }

  .choices {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }

  .block-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: var(--cream);
    background: var(--dirt);
    border: none;
    box-shadow:
      inset -5px -5px 0 var(--dirt-dark),
      inset 5px 5px 0 rgba(255,255,255,0.15);
    padding: 18px 4px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  .block-btn:hover:not(:disabled) {
    filter: brightness(1.12);
  }
  .block-btn:active:not(:disabled) {
    transform: translateY(2px);
  }
  .block-btn:disabled {
    cursor: default;
    opacity: 0.55;
  }
  .block-btn.picked {
    background: var(--stone);
    box-shadow:
      inset -5px -5px 0 var(--stone-dark),
      inset 5px 5px 0 rgba(255,255,255,0.15);
  }

  .message-box {
    min-height: 78px;
    background: #10170f;
    border: 3px solid #050804;
    padding: 14px 16px;
    font-size: 21px;
    line-height: 1.5;
    color: var(--cream);
    white-space: pre-wrap;
  }
  .message-box .safe { color: #8fe27a; }
  .message-box .danger { color: #ff8f7a; }

  .countdown {
    font-family: 'Press Start 2P', monospace;
    font-size: 34px;
    color: var(--tnt);
    text-align: center;
    margin-top: 10px;
    text-shadow: 3px 3px 0 #2a0a05;
    min-height: 44px;
  }

  .retry-btn {
    display: block;
    margin: 18px auto 0;
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: var(--cream);
    background: var(--grass-side);
    border: none;
    box-shadow:
      inset -4px -4px 0 #2f4a1c,
      inset 4px 4px 0 rgba(255,255,255,0.18);
    padding: 12px 18px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  .retry-btn:active { transform: translateY(2px); }
  .retry-btn.hidden { display: none; }

  @media (max-width: 380px) {
    h1 { font-size: 12px; }
    .block-btn { font-size: 10px; padding: 14px 2px; }
  }

  /* tab navigation */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
  }
  .tab-btn {
    flex: 1;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    color: var(--cream-dim);
    background: #182118;
    border: none;
    box-shadow: inset 0 -3px 0 #0a0f0a;
    padding: 10px 4px;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  .tab-btn.active {
    color: var(--cream);
    background: var(--dirt);
    box-shadow: inset -4px -4px 0 var(--dirt-dark), inset 4px 4px 0 rgba(255,255,255,0.15);
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* zombie-villager item grid */
  .item-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .item-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    font-family: 'VT323', monospace;
    font-size: 16px;
    color: var(--cream);
    background: var(--dirt);
    border: none;
    box-shadow: inset -4px -4px 0 var(--dirt-dark), inset 4px 4px 0 rgba(255,255,255,0.15);
    padding: 10px 4px 12px;
    cursor: pointer;
  }
  .item-btn:hover:not(:disabled) { filter: brightness(1.12); }
  .item-btn:active:not(:disabled) { transform: translateY(2px); }
  .item-btn:disabled { cursor: default; opacity: 0.55; }
  .item-btn.picked {
    background: var(--stone);
    box-shadow: inset -4px -4px 0 var(--stone-dark), inset 4px 4px 0 rgba(255,255,255,0.15);
  }

  .item-icon { position: relative; width: 40px; height: 40px; }

  .pixel-icon {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: 40px; height: 40px;
  }

  .message-box { text-align: center; }
  .message-box .neutral, .outcome-label.neutral { color: var(--cream-dim); }
  .message-box .peace, .outcome-label.peace { color: #ff9ad1; }
  .outcome-label.safe { color: #8fe27a; }
  .outcome-label.danger { color: #ff8f7a; }

  .outcome-label {
    text-align: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 15px;
    letter-spacing: 1px;
    margin: 12px 0 0;
    min-height: 15px;
  }

  /* zombie / villager face pair */
  .pixel-face {
    display: grid;
    grid-template-columns: repeat(8, 12px);
    grid-template-rows: repeat(8, 12px);
    box-shadow: 0 6px 0 rgba(0,0,0,0.4);
  }
  .face-pair { display: flex; justify-content: center; gap: 26px; margin-bottom: 22px; }
  .face-slot { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .face-label { font-family: 'VT323', monospace; font-size: 17px; color: var(--cream-dim); }

  /* fullscreen death screen */
  .death-screen {
    display: none;
    position: fixed; inset: 0;
    z-index: 1000;
    background: radial-gradient(ellipse at center, #4a0d0d 0%, #200707 65%, #0a0202 100%);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    opacity: 0;
    animation: deathFade 0.6s ease forwards;
  }
  .death-screen.show { display: flex; }
  @keyframes deathFade { to { opacity: 1; } }
  .death-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 30px;
    color: #ff4d4d;
    text-shadow: 4px 4px 0 #3a0000;
    margin-bottom: 18px;
    text-align: center;
  }
  .death-sub {
    font-family: 'VT323', monospace;
    font-size: 22px;
    color: #e8c9c9;
    margin-bottom: 32px;
    text-align: center;
  }
  .death-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    color: #e8c9c9;
    background: #3a2020;
    border: 2px solid #1a0f0f;
    padding: 12px 24px;
    cursor: pointer;
  }
  .death-btn:hover { background: #4a2828; }
  .death-btn:active { transform: translateY(2px); }
</style>
</head>
<body>

<div class="panel">
  <div class="grass-strip"></div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="creeper">크리퍼 게임</button>
    <button class="tab-btn" data-tab="zombie">주민 구하기</button>
  </div>

  <div class="tab-panel active" id="tab-creeper">
  <h1>크리퍼는 어디에?</h1>
  <p class="sub">세 블록 중 하나에 크리퍼가 숨어있어요</p>
  <p class="explosion-counter">오늘 폭발한 크리퍼 수: <span id="explosionCount">-</span></p>

  <div class="stage" id="stage">
    <div class="creeper-face" id="creeperFace"></div>
    <div class="explosion-burst" id="explosionBurst"></div>
  </div>

  <div class="choices" id="choices">
    <button class="block-btn" data-choice="1번">1번</button>
    <button class="block-btn" data-choice="2번">2번</button>
    <button class="block-btn" data-choice="3번">3번</button>
  </div>

  <div class="message-box" id="messageBox">블록을 하나 골라서 크리퍼를 찾아보세요.</div>
  <div class="countdown" id="countdown"></div>

  <button class="retry-btn hidden" id="retryBtn">다시 도전하기</button>
  </div>

  <div class="tab-panel" id="tab-zombie">
  <h1>주민을 구하라!</h1>
  <p class="sub">좀비로부터 주민을 구할 무기를 골라주세요</p>

  <div class="face-pair">
    <div class="face-slot">
      <div class="pixel-face" id="zombieFace"></div>
      <span class="face-label">좀비</span>
    </div>
    <div class="face-slot">
      <div class="pixel-face" id="villagerFace"></div>
      <span class="face-label">주민</span>
    </div>
  </div>

  <div class="item-grid" id="itemGrid">
    <button class="item-btn" data-item="다이아몬드 검">
      <span class="pixel-icon" id="iconSword"></span>
      다이아몬드 검
    </button>
    <button class="item-btn" data-item="닭고기">
      <span class="pixel-icon" id="iconChicken"></span>
      닭고기
    </button>
    <button class="item-btn" data-item="잔디 블록">
      <span class="pixel-icon" id="iconGrass"></span>
      잔디 블록
    </button>
    <button class="item-btn" data-item="민들레">
      <span class="pixel-icon" id="iconFlower"></span>
      민들레
    </button>
    <button class="item-btn" data-item="나무 곡괭이">
      <span class="pixel-icon" id="iconPickaxe"></span>
      나무 곡괭이
    </button>
    <button class="item-btn" data-item="tnt">
      <span class="pixel-icon" id="iconTnt"></span>
      TNT
    </button>
  </div>

  <div class="message-box" id="zombieMessage">주민을 구할 아이템을 골라보세요.</div>
  <div class="outcome-label" id="zombieLabel"></div>
  <div class="countdown" id="zombieCountdown"></div>

  <button class="retry-btn hidden" id="zombieRetryBtn">다시 선택하기</button>
  </div>
</div>

<div class="death-screen" id="deathScreen">
  <div class="death-title">You Died!</div>
  <div class="death-sub" id="deathSub">좀비에게 목숨을 잃었습니다</div>
  <button class="death-btn" id="deathRespawnBtn">다시 시작하기</button>
</div>

<script>
  // 8x8 creeper face, matched to the reference screenshot's layout:
  // L/M/D = bright/mid/dark green camo, Y = gray fleck, K = black (eyes+mouth mass)
  const FACE_MATRIX = [
    "LDMYYLMD",
    "DLMMDMMY",
    "MKKLMKKY",
    "MKKMDKKM",
    "MLLKKYDL",
    "LDKKKKLY",
    "YMKKKKMD",
    "LLKLLKDL"
  ];

  function buildFace() {
    const face = document.getElementById('creeperFace');
    const classMap = { L: 'px-L', M: 'px-M', D: 'px-D', Y: 'px-Y', K: 'px-K' };
    FACE_MATRIX.forEach(row => {
      [...row].forEach(ch => {
        const cell = document.createElement('div');
        cell.className = classMap[ch];
        face.appendChild(cell);
      });
    });
  }
  buildFace();

  // renderer for icons/faces sampled directly from the reference images (8x8, null = transparent)
  function renderPixelGrid(id, rows) {
    const el = document.getElementById(id);
    rows.forEach(row => {
      row.forEach(color => {
        const cell = document.createElement('div');
        if (color) cell.style.background = color;
        el.appendChild(cell);
      });
    });
  }

  const ZOMBIE_PIXELS = [
    ['#497439', '#446d35', '#4b7537', '#3d672f', '#395f2a', '#3c632f', '#446d35', '#456a36'],
    ['#446d35', '#446d35', '#446e35', '#4f7d3d', '#5a943f', '#5b9043', '#466d36', '#3e6833'],
    ['#456e37', '#689057', '#6e955b', '#799c65', '#73955c', '#70965c', '#5e8648', '#517e40'],
    ['#648552', '#6b8c57', '#648452', '#698756', '#5b7c49', '#70925b', '#527a3e', '#537c3f'],
    ['#6a8b56', '#1a1d18', '#1c1f1b', '#6b8b51', '#6f9059', '#1a1d19', '#1c1f1a', '#648552'],
    ['#4f7b37', '#678d4f', '#718e59', '#385327', '#3a5427', '#6b9455', '#4d7e38', '#3c672b'],
    ['#497034', '#487433', '#3f652d', '#4d6d30', '#4d6d30', '#395926', '#447031', '#40662f'],
    ['#365725', '#345523', '#3a5b29', '#395b28', '#416630', '#395b28', '#436731', '#3c602b'],
  ];
  renderPixelGrid('zombieFace', ZOMBIE_PIXELS);

  const VILLAGER_PIXELS = [
    ['#bf8b73', '#b67c68', '#bf8b74', '#b67c68', '#b67c68', '#b67c68', '#bf8b73', '#b67c68'],
    ['#bf8b73', '#b67c68', '#b67c68', '#b67c68', '#b67c68', '#b67c68', '#bf8b73', '#b67c68'],
    ['#bf8b73', '#b67c68', '#b67c68', '#b67c68', '#b67c68', '#b67c68', '#bf8b73', '#b67c68'],
    ['#b67c68', '#31210a', '#31210a', '#31210a', '#31210a', '#31210a', '#31210a', '#b37a66'],
    ['#bf8b73', '#fefefd', '#02960a', '#b57c68', '#b67c68', '#05960b', '#f9fcf8', '#bf8e76'],
    ['#915e43', '#b47c63', '#b78373', '#915e43', '#915e43', '#bf896d', '#b47c63', '#925e43'],
    ['#915e43', '#b47c63', '#794033', '#915e42', '#915e43', '#7a4133', '#b37b62', '#925e43'],
    ['#915e43', '#b47c63', '#b47c63', '#915e43', '#915e43', '#b37b62', '#b47c63', '#925e43'],
  ];
  renderPixelGrid('villagerFace', VILLAGER_PIXELS);

  const SWORD_PIXELS = [
    [null, null, null, null, null, null, '#2e645a', '#30645a'],
    [null, null, null, null, null, '#44786e', '#4fd2be', '#297470'],
    [null, null, null, null, '#1f6358', '#35b7a1', '#21ae9a', '#08393b'],
    [null, null, '#16594c', '#3a7369', '#0c9f86', '#07c1a3', '#226360', null],
    [null, null, '#195e51', '#00705f', '#00b799', '#11736a', null, null],
    [null, null, '#66735c', '#0f5a43', '#0e5d54', null, null, null],
    [null, '#03473a', '#52491a', '#4e4d32', '#0b413e', '#114043', null, null],
    [null, '#003933', '#08413a', '#635945', '#406667', '#4f7275', null, null],
  ];
  renderPixelGrid('iconSword', SWORD_PIXELS);

  const CHICKEN_PIXELS = [
    [null, '#c67f64', '#d38a6f', '#d58c71', '#cd856a', '#c17456', null, null],
    ['#d0937b', '#d08f76', '#eea48c', '#de977e', '#de977c', '#cd886d', '#c38673', null],
    ['#bd6c4d', '#e1967b', '#e89e84', '#f6b8a3', '#ffd7c8', '#ffd1c0', '#c67e67', '#934d3b'],
    ['#cc8165', '#d98c71', '#eead97', '#ffdacb', '#ffd7c8', '#fdc0ad', '#f6af97', '#b8735f'],
    ['#cd7f63', '#f6ae96', '#cf866b', '#e0a088', '#da947a', '#eca289', '#e1987e', '#ac6957'],
    ['#ce8060', '#d3866a', '#c5785c', '#fecdbb', '#fec1ab', '#c1765b', '#b87058', '#904b39'],
    ['#dd9d76', '#b2674c', '#d38667', '#f4b29c', '#d4876c', '#a05843', '#9c5b4b', null],
    [null, '#ca9074', '#b46f51', '#a65e47', '#8f4736', null, null, null],
  ];
  renderPixelGrid('iconChicken', CHICKEN_PIXELS);

  const GRASS_PIXELS = [
    [null, null, '#6d9164', '#45753a', '#457639', '#57824f', null, null],
    ['#56824c', '#447739', '#417534', '#3a6f2f', '#3a6f2e', '#386d2b', '#718433', null],
    ['#3e602d', '#3a692c', '#3b6e2d', '#396e2b', '#3a6f2e', '#3a6d2d', '#386126', '#404e1f'],
    ['#704829', '#544720', '#395a25', '#38652b', '#305c25', '#2f421b', '#32391a', '#4f331c'],
    ['#754827', '#6f4425', '#633e22', '#583e1e', '#46381d', '#493119', '#54331b', '#593820'],
    ['#714626', '#764724', '#714420', '#714423', '#5a351b', '#52321a', '#513119', '#5b391f'],
    ['#825635', '#744b2d', '#714523', '#6e4627', '#563219', '#5a361d', '#58371f', '#5f3e28'],
    [null, '#baafa7', '#885f41', '#7e4f2d', '#603e25', '#614631', '#a69487', null],

  renderPixelGrid('iconGrass', GRASS_PIXELS);

  const FLOWER_PIXELS = [

    [null, '#fff8ba', '#ffe933', '#ffcf00', '#fead00', '#feb200', '#ffeb57', null],

    ['#2e8a1a', '#188a00', '#449c1c', '#239800', '#1e8e00', '#1e8900', null, null],
    ['#399028', '#40a22e', '#1d8800', '#3ab200', '#339c01', '#449c15', '#5eaf42', '#44a335'],

    [null, null, null, '#389a08', '#198800', '#148600', '#90c989', null],
  ];
  renderPixelGrid('iconFlower', FLOWER_PIXELS);

  const PICKAXE_PIXELS = [
    [null, null, '#69532d', '#553c11', '#513b10', '#5b461e', '#84704e', '#9e8557'],
    [null, null, '#583e0f', '#472f01', '#402a03', '#674403', '#654302', '#58421c'],
    [null, null, null, null, '#857253', '#5d3f09', '#634103', '#493817'],
    [null, null, null, '#654d21', '#6b4a0d', '#43300b', '#3f2903', '#452e05'],
    [null, null, '#634b22', '#6b4a0d', '#554222', '#9b9486', '#352302', '#462f06'],
    [null, '#6d5730', '#63440b', '#43300b', '#9b9486', null, '#3b2908', '#4c350c'],
    ['#786236', '#5a3b02', '#594621', '#3b2f15', null, null, '#342916', '#3a301e'],
    ['#4c3813', '#4d370d', null, null, null, null, null, null],
  ];
  renderPixelGrid('iconPickaxe', PICKAXE_PIXELS);

  const TNT_PIXELS = [
    [null, null, '#e85335', '#c8321d', '#be2e18', '#d94122', null, null],
    ['#d53729', '#bf3523', '#982211', '#5f3033', '#5e1a1a', '#8c1f17', '#a42217', '#cc3c29'],
    ['#b91100', '#ab1400', '#a11c0c', '#613134', '#66272e', '#832820', '#9f1100', '#830c00'],
    ['#b05e5b', '#9d0e05', '#a40f00', '#ab1400', '#971300', '#7c0b00', '#780700', '#7f3933'],
    ['#aaa1a7', '#6a6675', '#966063', '#9c1e15', '#7b0b01', '#6b3333', '#645d64', '#65626a'],
    ['#ac1710', '#8d3c38', '#86767f', '#827c8a', '#7e7a80', '#605b61', '#64373b', '#720d08'],
    ['#a60b12', '#9b0700', '#9b0b00', '#993831', '#7b403e', '#6e0600', '#770700', '#7e0b06'],
    [null, '#ba5e59', '#9e050c', '#9b0400', '#7b0600', '#7c0e0a', '#9c4b4b', null],
  ];
  renderPixelGrid('iconTnt', TNT_PIXELS);

  // ── tab switching ──
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  // ── 주민 구하기 게임 ──
  const ZOMBIE_OUTCOMES = {
    "다이아몬드 검": { cls: 'danger', text: '좀비를 물리쳤어요! 하지만 힘을 얻은 주민이 당신도 위협합니다. 도망치세요!', deathSub: '힘을 얻은 주민에게 목숨을 잃었습니다' },
    "닭고기":        { cls: 'safe',   text: '좀비에게 닭고기를 미끼로 던지고 도망치는 데 성공했어요!', label: '주민 생존' },
    "잔디 블록":      { cls: 'neutral', text: '잔디 블록으로 좀비를 공격할 수 없습니다.', label: '실패!' },
    "민들레":        { cls: 'peace',  text: '좀비가 주민의 수줍은 고백을 받아줬어요!', label: '평화 달성!' },
    "나무 곡괭이":     { cls: 'neutral', text: '나무 곡괭이는 좀비를 물리치기에 너무 약한 무기네요.', label: '실패!' },
    "tnt":          { cls: 'danger', text: '폭탄이 터져요! 위험해요!', deathSub: '폭발에 휘말려 목숨을 잃었습니다' },
  };

  const itemGrid = document.getElementById('itemGrid');
  const zombieMessage = document.getElementById('zombieMessage');
  const zombieLabelEl = document.getElementById('zombieLabel');
  const zombieCountdownEl = document.getElementById('zombieCountdown');
  const zombieRetryBtn = document.getElementById('zombieRetryBtn');
  const deathScreen = document.getElementById('deathScreen');
  const deathSubEl = document.getElementById('deathSub');
  const deathRespawnBtn = document.getElementById('deathRespawnBtn');

  function runZombieCountdown(n) {
    if (n === 0) {
      zombieCountdownEl.textContent = '';
      deathScreen.classList.add('show');
      return;
    }
    zombieCountdownEl.textContent = n;
    setTimeout(() => runZombieCountdown(n - 1), 1000);
  }

  function handleItemPick(e) {
    const btn = e.currentTarget;
    const item = btn.dataset.item;
    [...itemGrid.children].forEach(b => {
      b.disabled = true;
      if (b === btn) b.classList.add('picked');
    });
    const outcome = ZOMBIE_OUTCOMES[item];
    zombieMessage.textContent = outcome.text;
    zombieLabelEl.textContent = outcome.label || '';
    zombieLabelEl.className = 'outcome-label' + (outcome.label ? ' ' + outcome.cls : '');

    if (outcome.cls === 'danger') {
      deathSubEl.textContent = outcome.deathSub;
      runZombieCountdown(3);
    } else {
      setTimeout(() => { zombieRetryBtn.classList.remove('hidden'); }, 400);
    }
  }

  function resetZombie() {
    zombieMessage.textContent = '주민을 구할 아이템을 골라보세요.';
    zombieLabelEl.textContent = '';
    zombieCountdownEl.textContent = '';
    zombieRetryBtn.classList.add('hidden');
    deathScreen.classList.remove('show');
    [...itemGrid.children].forEach(b => {
      b.disabled = false;
      b.classList.remove('picked');
    });
  }

  [...itemGrid.children].forEach(b => b.addEventListener('click', handleItemPick));
  zombieRetryBtn.addEventListener('click', resetZombie);
  deathRespawnBtn.addEventListener('click', resetZombie);

  // ── Firebase 설정 ──
  const firebaseConfig = {
    apiKey: "AIzaSyAvKKVDAAZvQ4NlNdQrkSe8eORh6uGPJmE",
    authDomain: "creeper-77cb9.firebaseapp.com",
    databaseURL: "https://creeper-77cb9-default-rtdb.firebaseio.com",
    projectId: "creeper-77cb9",
    storageBucket: "creeper-77cb9.firebasestorage.app",
    messagingSenderId: "324486121620",
    appId: "1:324486121620:web:278b4b9f6684bf6a6e8c81",
    measurementId: "G-FF1TXYL641",
  };

  let db = null;
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  } catch (e) {
    console.warn('Firebase 초기화 실패 (설정값을 아직 안 채우셨다면 정상입니다):', e);
  }

  const explosionCountEl = document.getElementById('explosionCount');

  function todayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function watchTodayCount() {
    if (!db) { explosionCountEl.textContent = '0'; return; }
    const ref = db.ref('explosions/' + todayKey());
    ref.on('value', (snap) => {
      explosionCountEl.textContent = snap.val() || 0;
    });
  }
  watchTodayCount();

  function incrementExplosionCount() {
    if (!db) return;
    const ref = db.ref('explosions/' + todayKey());
    ref.transaction((current) => (current || 0) + 1);
  }

  const choicesEl = document.getElementById('choices');
  const messageBox = document.getElementById('messageBox');
  const countdownEl = document.getElementById('countdown');
  const retryBtn = document.getElementById('retryBtn');
  const creeperFace = document.getElementById('creeperFace');
  const options = ["1번", "2번", "3번"];

  function pickBoom() {
    return options[Math.floor(Math.random() * options.length)];
  }

  let boom = pickBoom();

  function handlePick(e) {
    const btn = e.currentTarget;
    const num = btn.dataset.choice;

    [...choicesEl.children].forEach(b => {
      b.disabled = true;
      if (b === btn) b.classList.add('picked');
    });

    if (num === boom) {
      messageBox.innerHTML = '<span class="safe">크리퍼를 찾았어요! 생존하셨습니다.</span>';
      creeperFace.classList.add('shake');
      finishRound();
    } else {
      messageBox.innerHTML = '<span class="danger">땡! 크리퍼가 곧 터져요! 도망가세요!</span>';
      creeperFace.classList.add('shake');
      runCountdown(3);
    }
  }

  const stageEl = document.getElementById('stage');
  const panelEl = document.querySelector('.panel');
  const explosionBurst = document.getElementById('explosionBurst');

  function runCountdown(n) {
    if (n === 0) {
      countdownEl.textContent = '펑!';
      messageBox.innerHTML += '\n크리퍼가 터졌어요! 도망가지 못했어요...';
      triggerExplosion();
      finishRound();
      return;
    }
    countdownEl.textContent = n;
    setTimeout(() => runCountdown(n - 1), 1000);
  }

  // blocky smoke/spark tones, matching creeper explosion particles
  const CHUNK_TONES = ['#f0f0f0', '#f0f0f0', '#d6d6d6', '#d6d6d6', '#b0b0b0', '#b0b0b0', '#8a8a8a', '#5c5c5c', '#3a3a3a', '#52d94a', '#1a5e18'];
  const SMOKE_TONES = ['#f5f5f5', '#e2e2e2', '#cfcfcf', '#b8b8b8', '#9c9c9c', '#7e7e7e', '#5f5f5f'];

  function buildExplosion() {
    explosionBurst.innerHTML = '';
    const flash = document.createElement('div');
    flash.className = 'blast-flash';
    explosionBurst.appendChild(flash);

    // big billowing gray smoke chunks (the bulk of the cloud)
    const puffCount = 16;
    for (let i = 0; i < puffCount; i++) {
      const angle = (Math.PI * 2 * i) / puffCount + (Math.random() * 0.5 - 0.25);
      const dist = 20 + Math.random() * 48;
      const tx = Math.cos(angle) * dist;
      const ty = Math.sin(angle) * dist * 0.75 - 18;
      const size = 22 + Math.random() * 26;
      const tone = SMOKE_TONES[Math.floor(Math.random() * SMOKE_TONES.length)];
      const delay = Math.random() * 0.12;
      const rot = (Math.random() * 360 - 180) + 'deg';

      const puff = document.createElement('span');
      puff.className = 'smoke-puff';
      puff.style.setProperty('--tx', tx.toFixed(1) + 'px');
      puff.style.setProperty('--ty', ty.toFixed(1) + 'px');
      puff.style.setProperty('--rot', rot);
      puff.style.setProperty('--size', size.toFixed(1) + 'px');
      puff.style.setProperty('--tone', tone);
      puff.style.setProperty('--delay', delay.toFixed(2) + 's');
      explosionBurst.appendChild(puff);
    }

    // smaller fast-flying chips on top for texture
    const count = 22;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() * 0.4 - 0.2);
      const dist = 55 + Math.random() * 60;
      const tx = Math.cos(angle) * dist;
      const ty = Math.sin(angle) * dist * 0.8 - 15;
      const size = 6 + Math.random() * 9;
      const tone = CHUNK_TONES[Math.floor(Math.random() * CHUNK_TONES.length)];
      const delay = Math.random() * 0.08;
      const rot = (Math.random() * 360 - 180) + 'deg';

      const chunk = document.createElement('span');
      chunk.className = 'chunk';
      chunk.style.setProperty('--tx', tx.toFixed(1) + 'px');
      chunk.style.setProperty('--ty', ty.toFixed(1) + 'px');
      chunk.style.setProperty('--rot', rot);
      chunk.style.setProperty('--size', size.toFixed(1) + 'px');
      chunk.style.setProperty('--tone', tone);
      chunk.style.setProperty('--delay', delay.toFixed(2) + 's');
      explosionBurst.appendChild(chunk);
    }
  }

  function triggerExplosion() {
    stageEl.classList.add('exploding');
    buildExplosion();
    incrementExplosionCount();
    panelEl.classList.add('shake-panel');
    setTimeout(() => panelEl.classList.remove('shake-panel'), 500);
  }

  function finishRound() {
    setTimeout(() => {
      retryBtn.classList.remove('hidden');
    }, 400);
  }

  function resetGame() {
    boom = pickBoom();
    countdownEl.textContent = '';
    messageBox.textContent = '블록을 하나 골라서 크리퍼를 찾아보세요.';
    creeperFace.classList.remove('shake');
    stageEl.classList.remove('exploding');
    explosionBurst.innerHTML = '';
    retryBtn.classList.add('hidden');
    [...choicesEl.children].forEach(b => {
      b.disabled = false;
      b.classList.remove('picked');
    });
  }

  [...choicesEl.children].forEach(b => b.addEventListener('click', handlePick));
  retryBtn.addEventListener('click', resetGame);
</script>
